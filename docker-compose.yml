version: '3.8'

services:
  sre-comp1:
    build:
      context: ./component1
      dockerfile: Dockerfile
    container_name: sre-comp1
    ports:
      - "8001:8001"
    restart: unless-stopped

  sre-comp4:
    build:
      context: ./cpu_spike_predictor
      dockerfile: Dockerfile
    container_name: sre-comp4
    ports:
      - "8000:8000"
    restart: unless-stopped

  sre-gateway:
    build:
      context: ./Dashboard
      dockerfile: Dockerfile
    container_name: sre-gateway
    ports:
      - "8766:8766"
    depends_on:
      - sre-comp1
      - sre-comp4
    restart: unless-stopped

  sre-dashboard-ui:
    build:
      context: ./Dashboard/dashboard-ui
      dockerfile: Dockerfile
    container_name: sre-dashboard-ui
    ports:
      - "80:80"
    depends_on:
      - sre-gateway
    restart: unless-stopped
