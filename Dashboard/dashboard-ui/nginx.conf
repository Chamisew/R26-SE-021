server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests to the Azure Container App gateway
    location /api/ {
        proxy_pass https://sre-gateway.ashyplant-2a3adff3.southeastasia.azurecontainerapps.io/api/;

        # CRITICAL: correct Host + TLS SNI so Azure accepts the HTTPS connection
        proxy_set_header Host sre-gateway.ashyplant-2a3adff3.southeastasia.azurecontainerapps.io;
        proxy_ssl_server_name on;
        proxy_ssl_name sre-gateway.ashyplant-2a3adff3.southeastasia.azurecontainerapps.io;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (Azure Container Apps cold-start can take ~10-15s)
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
